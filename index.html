<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karting Cuecen - Championship 2025</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #111;
            color: #e0e0e0;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 3px solid #e10600;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #888;
            margin-top: 0.3rem;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .tab {
            padding: 0.6rem 1.2rem;
            background: #1e1e2e;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: #aaa;
            transition: all 0.2s;
        }

        .tab:hover { border-color: #555; color: #fff; }
        .tab.active { background: #e10600; border-color: #e10600; color: #fff; }

        .view { display: none; }
        .view.active { display: block; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: #16213e;
            padding: 0.8rem 0.6rem;
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            border-bottom: 2px solid #e10600;
        }

        td {
            padding: 0.7rem 0.6rem;
            border-bottom: 1px solid #222;
            font-size: 0.9rem;
        }

        tr:hover td { background: rgba(255,255,255,0.03); }

        .pos { font-weight: 800; width: 40px; text-align: center; }
        .pos-1 { color: #ffd700; }
        .pos-2 { color: #c0c0c0; }
        .pos-3 { color: #cd7f32; }

        .driver-name { font-weight: 600; }

        .team-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .points-total {
            font-weight: 800;
            font-size: 1.05rem;
            text-align: right;
        }

        .points-cell {
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .fl-badge {
            display: inline-block;
            background: #6a0dad;
            color: #fff;
            font-size: 0.65rem;
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
            margin-left: 0.3rem;
            font-weight: 700;
            vertical-align: middle;
        }

        .race-header-group {
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #666;
            font-size: 1.1rem;
        }

        .race-card {
            background: #1a1a2e;
            border-radius: 10px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .race-card-header {
            background: #16213e;
            padding: 0.8rem 1rem;
            font-weight: 700;
            border-bottom: 2px solid #e10600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .race-card-header .fl-info {
            font-size: 0.8rem;
            color: #aaa;
            font-weight: 400;
        }

        .trend-up { color: #00c853; font-size: 0.75rem; }
        .trend-down { color: #ff1744; font-size: 0.75rem; }
        .trend-same { color: #666; font-size: 0.75rem; }

        .next-race-banner {
            background: linear-gradient(135deg, #1e3a1e, #16213e);
            border: 1px solid #2e7d32;
            border-radius: 10px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .next-race-banner h3 {
            color: #66bb6a;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        .next-race-banner p {
            color: #aaa;
            font-size: 0.9rem;
        }

        .chart-container {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 1.5rem 1rem 1rem;
            overflow-x: auto;
        }

        #positionChart {
            width: 100%;
            min-height: 500px;
        }

        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            padding: 1rem;
            background: #1a1a2e;
            border-radius: 0 0 10px 10px;
            margin-top: -10px;
            justify-content: center;
        }

        .chart-legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: #ccc;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .chart-legend-item.dimmed { opacity: 0.25; }

        .chart-legend-swatch {
            width: 24px;
            height: 4px;
            border-radius: 2px;
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 10px;
        }

        .table-wrapper table {
            min-width: 500px;
        }

        .race-card-header {
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        @media (max-width: 768px) {
            header { padding: 1.5rem 1rem; }
            header h1 { font-size: 1.8rem; }
            header p { font-size: 0.85rem; }
            .container { padding: 1rem 0.5rem; }
            td, th { padding: 0.5rem 0.4rem; font-size: 0.82rem; }
            .points-total { font-size: 0.95rem; }
            .chart-container { padding: 1rem 0.5rem 0.5rem; }
        }

        @media (max-width: 480px) {
            header h1 { font-size: 1.3rem; letter-spacing: 1px; }
            header p { font-size: 0.75rem; }
            .container { padding: 0.8rem 0.75rem; }
            .tabs { gap: 0.3rem; }
            .tab { padding: 0.45rem 0.65rem; font-size: 0.75rem; }
            td, th { padding: 0.4rem 0.25rem; font-size: 0.75rem; }
            .pos { width: 28px; }
            .team-badge { font-size: 0.65rem; padding: 0.1rem 0.3rem; }
            .fl-badge { font-size: 0.55rem; padding: 0.05rem 0.25rem; }
            .points-total { font-size: 0.85rem; }
            .race-card-header { padding: 0.6rem 0.7rem; font-size: 0.85rem; }
            .race-card-header .fl-info { font-size: 0.7rem; }
            .chart-legend { gap: 0.4rem 0.8rem; padding: 0.7rem; }
            .chart-legend-item { font-size: 0.7rem; }
            .chart-legend-swatch { width: 18px; }
            .next-race-banner { padding: 0.8rem; }
            .next-race-banner h3 { font-size: 0.75rem; }
            .next-race-banner p { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Karting Cuecen</h1>
        <p>Campeonato Amateur 2025 – 2026</p>
    </header>

    <div class="container">
        <div class="tabs">
            <div class="tab active" data-view="drivers">Pilotos</div>
            <div class="tab" data-view="teams">Equipos</div>
            <div class="tab" data-view="races">Carreras</div>
            <div class="tab" data-view="chart">Gráfico</div>
        </div>

        <div id="drivers" class="view active">
            <div class="loading">Cargando datos...</div>
        </div>

        <div id="teams" class="view">
            <div class="loading">Cargando datos...</div>
        </div>

        <div id="races" class="view">
            <div class="loading">Cargando datos...</div>
        </div>

        <div id="chart" class="view">
            <div class="chart-container">
                <canvas id="positionChart"></canvas>
            </div>
            <div id="chartLegend" class="chart-legend"></div>
        </div>
    </div>

    <footer style="text-align:center;padding:2rem 1rem 1.5rem;color:#555;font-size:0.8rem;letter-spacing:0.5px;">
        Vibe coded by Macs & Claude
    </footer>

    <script>
        const SHEET_ID = '1s0-Zzr0Nbnz6XiKwKvOVgJjVnm_ydG1gYPM-mabAZ9A';
        const BASE = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=`;

        // --- Fetch via Google Visualization API (JSONP, no CORS issues) ---
        function fetchSheet(name) {
            return new Promise((resolve, reject) => {
                const callbackName = 'cb_' + name.replace(/\s/g, '_') + '_' + Date.now();
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${callbackName}&sheet=${encodeURIComponent(name)}`;

                window[callbackName] = function(response) {
                    delete window[callbackName];
                    document.head.removeChild(script);
                    if (!response || !response.table) return reject(new Error('No data'));

                    const allRows = response.table.rows;
                    const hasHeaders = response.table.parsedNumHeaders > 0;
                    let headers, dataRows;
                    if (hasHeaders) {
                        headers = response.table.cols.map(c => c.label || '');
                        dataRows = allRows;
                    } else {
                        const headerRow = allRows[0];
                        headers = headerRow.c.map(cell => cell ? String(cell.v != null ? cell.v : (cell.f || '')) : '');
                        dataRows = allRows.slice(1);
                    }
                    const rows = dataRows.map(r => {
                        const obj = {};
                        headers.forEach((h, i) => {
                            const cell = r.c && r.c[i];
                            obj[h] = cell ? (cell.v != null ? String(cell.v) : (cell.f || '')) : '';
                        });
                        return obj;
                    });
                    resolve(rows);
                };

                const script = document.createElement('script');
                script.src = url;
                script.onerror = () => { delete window[callbackName]; reject(new Error('Failed to load ' + name)); };
                document.head.appendChild(script);
                });
        }

        // --- Points system ---
        const POINTS_MAP = {
            FL: 1, 1: 25, 2: 20, 3: 16, 4: 13, 5: 11,
            6: 10, 7: 9, 8: 8, 9: 7, 10: 6,
            11: 5, 12: 4, 13: 3, 14: 2
        };

        // --- Format date ---
        function fmtDate(str) {
            const [d, m, y] = str.split('-');
            const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
            return `${parseInt(d)} ${months[parseInt(m) - 1]} ${y}`;
        }

        // --- Init ---
        Promise.all([
            fetchSheet('drivers'),
            fetchSheet('teams'),
            fetchSheet('races'),
            fetchSheet('points')
        ]).then(([drivers, teams, races, points]) => {
            const teamColors = {};
            teams.forEach(t => {
                teamColors[t.team] = { bg: t.team_color, font: t.font_color };
            });

            // Find each driver's team
            const driverTeam = {};
            drivers.forEach(d => { driverTeam[d.driver_name] = d.team; });

            // Calculate driver points per race
            const driverPoints = {}; // { name: { total, races: [pts...], fl: count } }
            drivers.forEach(d => {
                driverPoints[d.driver_name] = { total: 0, races: [], fl: 0 };
            });

            races.forEach(race => {
                const fl = race.FL;
                const raceResults = {};

                for (let pos = 1; pos <= 14; pos++) {
                    const name = race[String(pos)];
                    if (!name) continue;
                    const pts = POINTS_MAP[pos] || 0;
                    const flPts = (name === fl) ? POINTS_MAP.FL : 0;
                    raceResults[name] = pts + flPts;
                }

                drivers.forEach(d => {
                    const name = d.driver_name;
                    const pts = raceResults[name] || 0;
                    if (!driverPoints[name]) driverPoints[name] = { total: 0, races: [], fl: 0 };
                    driverPoints[name].total += pts;
                    driverPoints[name].races.push(raceResults[name] !== undefined ? raceResults[name] : null);
                    if (name === fl) driverPoints[name].fl++;
                });
            });

            // Sort drivers by total points
            const sorted = Object.entries(driverPoints)
                .sort((a, b) => b[1].total - a[1].total);

            // --- Render Drivers Standings ---
            let html = '<div class="table-wrapper"><table><thead><tr>';
            html += '<th class="pos">#</th><th>Piloto</th><th>Equipo</th>';
            races.forEach((r, i) => {
                html += `<th class="points-cell">F${i + 1}</th>`;
            });
            html += '<th style="text-align:right">PTS</th></tr></thead><tbody>';

            sorted.forEach(([name, data], i) => {
                const team = driverTeam[name] || '';
                const colors = teamColors[team] || { bg: '#333', font: '#fff' };
                const posClass = i < 3 ? ` pos-${i + 1}` : '';
                html += `<tr>`;
                html += `<td class="pos${posClass}">${i + 1}</td>`;
                html += `<td class="driver-name">${name}`;
                if (data.fl > 0) html += `<span class="fl-badge">FL ×${data.fl}</span>`;
                html += `</td>`;
                html += `<td><span class="team-badge" style="background:${colors.bg};color:${colors.font}">${team}</span></td>`;
                data.races.forEach(pts => {
                    html += `<td class="points-cell">${pts !== null ? pts : '–'}</td>`;
                });
                html += `<td class="points-total">${data.total}</td>`;
                html += `</tr>`;
            });
            html += '</tbody></table></div>';
            document.getElementById('drivers').innerHTML = html;

            // --- Render Teams Standings ---
            const teamPoints = {};
            teams.forEach(t => { teamPoints[t.team] = { total: 0, races: [] }; });

            races.forEach((race, ri) => {
                const raceTeamPts = {};
                teams.forEach(t => { raceTeamPts[t.team] = 0; });

                for (let pos = 1; pos <= 14; pos++) {
                    const name = race[String(pos)];
                    if (!name) continue;
                    const t = driverTeam[name];
                    if (!t) continue;
                    const pts = POINTS_MAP[pos] || 0;
                    const flPts = (name === race.FL) ? POINTS_MAP.FL : 0;
                    raceTeamPts[t] += pts + flPts;
                }

                teams.forEach(t => {
                    teamPoints[t.team].total += raceTeamPts[t.team];
                    teamPoints[t.team].races.push(raceTeamPts[t.team]);
                });
            });

            const sortedTeams = Object.entries(teamPoints)
                .sort((a, b) => b[1].total - a[1].total);

            let thtml = '<div class="table-wrapper"><table><thead><tr>';
            thtml += '<th class="pos">#</th><th>Equipo</th><th>Pilotos</th>';
            races.forEach((r, i) => {
                thtml += `<th class="points-cell">F${i + 1}</th>`;
            });
            thtml += '<th style="text-align:right">PTS</th></tr></thead><tbody>';

            sortedTeams.forEach(([team, data], i) => {
                const colors = teamColors[team] || { bg: '#333', font: '#fff' };
                const posClass = i < 3 ? ` pos-${i + 1}` : '';
                const teamDrivers = drivers.filter(d => d.team === team).map(d => d.driver_name).join(', ');
                thtml += `<tr>`;
                thtml += `<td class="pos${posClass}">${i + 1}</td>`;
                thtml += `<td><span class="team-badge" style="background:${colors.bg};color:${colors.font}">${team}</span></td>`;
                thtml += `<td style="color:#888;font-size:0.82rem">${teamDrivers}</td>`;
                data.races.forEach(pts => {
                    thtml += `<td class="points-cell">${pts}</td>`;
                });
                thtml += `<td class="points-total">${data.total}</td>`;
                thtml += `</tr>`;
            });
            thtml += '</tbody></table></div>';
            document.getElementById('teams').innerHTML = thtml;

            // --- Render Races ---
            let rhtml = '';
            if (races.length < 4) {
                rhtml += `<div class="next-race-banner">
                    <h3>Próxima Fecha</h3>
                    <p>Fecha ${races.length + 1} de 4 — Por confirmar</p>
                </div>`;
            }

            [...races].reverse().forEach((race, i) => {
                const ri = races.length - 1 - i;
                rhtml += `<div class="race-card">`;
                rhtml += `<div class="race-card-header">
                    <span>Fecha ${ri + 1} — ${fmtDate(race.race_date)}</span>
                    <span class="fl-info">Vuelta rápida: ${race.FL}</span>
                </div>`;
                rhtml += `<table><thead><tr><th class="pos">POS</th><th>Piloto</th><th>Equipo</th><th style="text-align:right">PTS</th></tr></thead><tbody>`;

                for (let pos = 1; pos <= 14; pos++) {
                    const name = race[String(pos)];
                    if (!name) break;
                    const team = driverTeam[name] || '';
                    const colors = teamColors[team] || { bg: '#333', font: '#fff' };
                    const posClass = pos <= 3 ? ` pos-${pos}` : '';
                    const pts = POINTS_MAP[pos] || 0;
                    const flPts = (name === race.FL) ? POINTS_MAP.FL : 0;
                    const total = pts + flPts;

                    rhtml += `<tr>`;
                    rhtml += `<td class="pos${posClass}">${pos}</td>`;
                    rhtml += `<td class="driver-name">${name}`;
                    if (name === race.FL) rhtml += `<span class="fl-badge">FL</span>`;
                    rhtml += `</td>`;
                    rhtml += `<td><span class="team-badge" style="background:${colors.bg};color:${colors.font}">${team}</span></td>`;
                    rhtml += `<td class="points-total">${total}</td>`;
                    rhtml += `</tr>`;
                }

                rhtml += `</tbody></table></div>`;
            });
            document.getElementById('races').innerHTML = rhtml;

            // --- Render Position Chart (deferred until tab is visible) ---
            window._chartData = { drivers, races, driverTeam, teamColors };
            // Draw immediately if tab is already visible, otherwise wait
            if (document.getElementById('chart').classList.contains('active')) {
                renderPositionChart(drivers, races, driverTeam, teamColors);
            }

        }).catch(err => {
            document.querySelectorAll('.loading').forEach(el => {
                el.textContent = 'Error cargando datos: ' + err.message;
            });
        });

        // --- Position Chart ---
        function renderPositionChart(drivers, races, driverTeam, teamColors) {
            const canvas = document.getElementById('positionChart');
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;

            const driverNames = drivers.map(d => d.driver_name);
            const numRaces = races.length;
            const numCols = numRaces; // F1, F2, F3 (no "Inicio")

            // cumPoints[name][col] = cumulative points after race col
            const cumPoints = {};
            driverNames.forEach(n => { cumPoints[n] = []; });

            races.forEach((race, ri) => {
                const fl = race.FL;
                driverNames.forEach(name => {
                    const prev = ri > 0 ? cumPoints[name][ri - 1] : 0;
                    let earned = 0;
                    for (let pos = 1; pos <= 14; pos++) {
                        if (race[String(pos)] === name) {
                            earned = POINTS_MAP[pos] || 0;
                            if (name === fl) earned += POINTS_MAP.FL;
                            break;
                        }
                    }
                    cumPoints[name].push(prev + earned);
                });
            });

            // positions[name][col] = position (1-based)
            const positions = {};
            driverNames.forEach(n => { positions[n] = []; });

            for (let col = 0; col < numCols; col++) {
                const standing = driverNames.map(n => ({ name: n, pts: cumPoints[n][col] }));
                standing.sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name));
                standing.forEach((s, idx) => { positions[s.name].push(idx + 1); });
            }

            const totalDrivers = driverNames.length;

            // Driver styles: team color, dashed for 2nd teammate
            const teamDriverIndex = {};
            const driverStyle = {};
            driverNames.forEach(name => {
                const team = driverTeam[name];
                if (!teamDriverIndex[team]) teamDriverIndex[team] = 0;
                const idx = teamDriverIndex[team]++;
                const colors = teamColors[team] || { bg: '#888' };
                driverStyle[name] = {
                    color: colors.bg,
                    dash: idx === 1 ? [8, 4] : [],
                    width: 2.5
                };
            });

            // Chart dimensions
            const margin = { top: 50, right: 90, bottom: 30, left: 45 };
            const w = canvas.parentElement.clientWidth;
            const h = Math.max(520, totalDrivers * 38 + margin.top + margin.bottom);

            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.scale(dpr, dpr);

            const plotW = w - margin.left - margin.right;
            const plotH = h - margin.top - margin.bottom;

            // With few columns, space them evenly across the full width
            function x(col) {
                if (numCols === 1) return margin.left + plotW / 2;
                return margin.left + (col / (numCols - 1)) * plotW;
            }
            function y(pos) { return margin.top + ((pos - 1) / (totalDrivers - 1)) * plotH; }

            const colLabels = races.map((r, i) => 'Fecha ' + (i + 1));
            const colDates = races.map(r => fmtDate(r.race_date));
            const hiddenDrivers = new Set();

            function drawChart() {
                ctx.clearRect(0, 0, w, h);

                // Background
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, w, h);

                // Horizontal grid + Y labels
                for (let p = 1; p <= totalDrivers; p++) {
                    ctx.strokeStyle = p <= 3 ? '#2a3a2e' : '#222238';
                    ctx.lineWidth = p <= 3 ? 0.8 : 0.5;
                    ctx.beginPath();
                    ctx.moveTo(margin.left, y(p));
                    ctx.lineTo(w - margin.right, y(p));
                    ctx.stroke();

                    ctx.fillStyle = p <= 3 ? '#aaa' : '#666';
                    ctx.font = p <= 3 ? 'bold 13px system-ui' : '12px system-ui';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p, margin.left - 12, y(p));
                }

                // Vertical grid + X labels
                for (let c = 0; c < numCols; c++) {
                    ctx.strokeStyle = '#222238';
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(x(c), margin.top);
                    ctx.lineTo(x(c), h - margin.bottom);
                    ctx.stroke();

                    ctx.fillStyle = '#ccc';
                    ctx.font = 'bold 12px system-ui';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(colLabels[c], x(c), margin.top - 18);

                    ctx.fillStyle = '#777';
                    ctx.font = '10px system-ui';
                    ctx.fillText(colDates[c], x(c), margin.top - 5);
                }

                // Title
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('POSITION CHART', w / 2, 18);

                // Draw lines
                driverNames.forEach(name => {
                    if (hiddenDrivers.has(name)) return;
                    const style = driverStyle[name];
                    const pos = positions[name];

                    ctx.strokeStyle = style.color;
                    ctx.lineWidth = style.width;
                    ctx.setLineDash(style.dash);
                    ctx.lineJoin = 'round';
                    ctx.lineCap = 'round';

                    ctx.beginPath();
                    pos.forEach((p, i) => {
                        if (i === 0) ctx.moveTo(x(i), y(p));
                        else ctx.lineTo(x(i), y(p));
                    });
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Dots
                    pos.forEach((p, i) => {
                        ctx.beginPath();
                        ctx.arc(x(i), y(p), 5, 0, Math.PI * 2);
                        ctx.fillStyle = '#1a1a2e';
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(x(i), y(p), 4, 0, Math.PI * 2);
                        ctx.fillStyle = style.color;
                        ctx.fill();
                    });

                    // Name label at the end
                    const lastPos = pos[pos.length - 1];
                    ctx.fillStyle = style.color;
                    ctx.font = 'bold 11px system-ui';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(name, x(numCols - 1) + 10, y(lastPos));
                });
            }

            drawChart();

            // Legend with toggle
            const legendEl = document.getElementById('chartLegend');
            legendEl.innerHTML = '';
            driverNames.forEach(name => {
                const style = driverStyle[name];
                const item = document.createElement('div');
                item.className = 'chart-legend-item';
                const swatchStyle = style.dash.length
                    ? `background:repeating-linear-gradient(90deg,${style.color} 0 8px,transparent 8px 12px)`
                    : `background:${style.color}`;
                item.innerHTML = `<span class="chart-legend-swatch" style="${swatchStyle}"></span>${name}`;
                item.addEventListener('click', () => {
                    if (hiddenDrivers.has(name)) { hiddenDrivers.delete(name); item.classList.remove('dimmed'); }
                    else { hiddenDrivers.add(name); item.classList.add('dimmed'); }
                    drawChart();
                });
                legendEl.appendChild(item);
            });
        }

        // --- Tabs ---
        let chartRendered = false;
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.view).classList.add('active');

                // Render chart on first visit (needs visible container for dimensions)
                if (tab.dataset.view === 'chart' && !chartRendered && window._chartData) {
                    chartRendered = true;
                    const d = window._chartData;
                    renderPositionChart(d.drivers, d.races, d.driverTeam, d.teamColors);
                }
            });
        });
    </script>
</body>
</html>
